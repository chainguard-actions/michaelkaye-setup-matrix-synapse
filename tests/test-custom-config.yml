name: Test custom config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure python and venv are available
        run: |
          SUDO=""; if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
          if ! command -v python >/dev/null 2>&1; then
            $SUDO ln -sf "$(command -v python3)" /usr/local/bin/python
          fi
          python --version
          if ! python -m venv /tmp/venv-probe >/dev/null 2>&1; then
            $SUDO apt-get update -y
            $SUDO apt-get install -y python3-venv
          fi
          rm -rf /tmp/venv-probe
      - id: action
        uses: .
        with:
          uploadLogs: 'false'
          httpPort: '8092'
          customConfig: '{"max_upload_size": "10M"}'
      - name: Assert synapse-url output
        env:
          ACTUAL: ${{ steps.action.outputs.synapse-url }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "http://localhost:8092/" ]; then
            echo "FAIL: expected 'http://localhost:8092/'"
            exit 1
          fi
          echo "PASS"
      - name: Assert custom config was written and applied
        run: |
          cat "$GITHUB_WORKSPACE/synapse/custom.yaml"
          grep -q '"max_upload_size": "10M"' "$GITHUB_WORKSPACE/synapse/custom.yaml" || { echo "FAIL: custom.yaml"; exit 1; }
          BODY="$(curl -sf http://localhost:8092/_matrix/client/versions)"
          echo "body: $BODY"
          echo "$BODY" | grep -q '"versions"' || { echo "FAIL: server not up"; exit 1; }
          echo "PASS"
