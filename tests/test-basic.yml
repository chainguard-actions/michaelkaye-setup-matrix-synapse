name: Test basic usage (venv installer)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure python and venv are available
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          if ! command -v python3 >/dev/null 2>&1 || ! python3 -m venv /tmp/venvcheck >/dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y python3 python3-venv python3-pip
          fi
          rm -rf /tmp/venvcheck
          if ! command -v python >/dev/null 2>&1; then
            $SUDO ln -sf "$(command -v python3)" /usr/local/bin/python
          fi
          python --version
      - id: action
        uses: .
        with:
          uploadLogs: false
      - name: Assert synapse-url output
        env:
          ACTUAL: ${{ steps.action.outputs.synapse-url }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "http://localhost:8080/" ]; then
            echo "FAIL: expected 'http://localhost:8080/'"
            exit 1
          fi
          echo "PASS"
      - name: Assert generated config files exist
        run: |
          for f in homeserver.yaml additional.yaml custom.yaml out.log err.log; do
            if [ ! -f "$GITHUB_WORKSPACE/synapse/$f" ]; then
              echo "FAIL: missing synapse/$f"
              exit 1
            fi
          done
          cat "$GITHUB_WORKSPACE/synapse/additional.yaml"
          grep -q '"public_baseurl": "http://localhost:8080"' "$GITHUB_WORKSPACE/synapse/additional.yaml" || { echo "FAIL: public_baseurl default wrong"; exit 1; }
          grep -q '"port": 8080' "$GITHUB_WORKSPACE/synapse/additional.yaml" || { echo "FAIL: port wrong"; exit 1; }
          grep -q '"rc_message"' "$GITHUB_WORKSPACE/synapse/additional.yaml" || { echo "FAIL: rate limiting not disabled"; exit 1; }
          CUSTOM="$(cat "$GITHUB_WORKSPACE/synapse/custom.yaml")"
          echo "custom.yaml: $CUSTOM"
          if [ "$CUSTOM" != "{}" ]; then
            echo "FAIL: expected default custom config '{}'"
            exit 1
          fi
          echo "PASS"
      - name: Assert server responds and allows registration
        run: |
          VERSIONS="$(curl -sf http://localhost:8080/_matrix/client/versions)"
          echo "versions: $VERSIONS"
          echo "$VERSIONS" | grep -q '"versions"' || { echo "FAIL: versions endpoint bad"; exit 1; }
          RESP="$(curl -s -X POST -H 'Content-Type: application/json' \
            -d '{"username":"alice","password":"Sup3rSecret!pw","auth":{"type":"m.login.dummy"}}' \
            http://localhost:8080/_matrix/client/v3/register)"
          echo "register: $RESP"
          echo "$RESP" | grep -q '"access_token"' || { echo "FAIL: registration did not return access_token"; exit 1; }
          echo "PASS"
