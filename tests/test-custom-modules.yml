name: Test customModules installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare python environment
        run: |
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO=sudo
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$HOME/.pybin"
            ln -sf "$(command -v python3)" "$HOME/.pybin/python"
            echo "$HOME/.pybin" >> "$GITHUB_PATH"
          fi
          if ! python3 -m venv /tmp/venvcheck >/dev/null 2>&1; then
            $SUDO apt-get update && $SUDO apt-get install -y python3-venv
          fi
          rm -rf /tmp/venvcheck "$GITHUB_WORKSPACE/synapse"
      - id: action
        uses: .
        with:
          uploadLogs: false
          httpPort: 8092
          customModules: 'six,toml'
      - name: Assert synapse-url output
        env:
          ACTUAL: ${{ steps.action.outputs.synapse-url }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "http://localhost:8092/" ]; then
            echo "FAIL: expected 'http://localhost:8092/'"
            exit 1
          fi
          echo "PASS"
      - name: Assert modules installed in synapse venv
        run: |
          pip="$GITHUB_WORKSPACE/synapse/env/bin/pip"
          for m in six toml; do
            "$pip" show "$m" >/dev/null 2>&1 || { echo "FAIL: module $m not installed"; exit 1; }
            echo "module $m installed"
          done
          echo "PASS"
      - name: Assert server responds
        run: |
          curl -sf http://localhost:8092/_matrix/client/versions || { echo "FAIL: endpoint unreachable"; exit 1; }
          echo
          echo "PASS"
